[project]
name = "mountory-core"
version = "0.6.0"
description = "Core backend functionality of the mountory package"
readme = "README.md"
authors = [
    { name = "saltie2193", email = "saltie@protonmail.com" }
]
requires-python = ">=3.12, <4"
dependencies = [
    "psycopg[binary]>=3.3.3,<4.0.0",
    "pwdlib[argon2,bcrypt]>=0.3.0,<1.0.0",
    "pydantic-settings>=2.14.2,<3.0.0",
    "pydantic[email]>=2.13.3,<2.14.0",
    "sqlalchemy[asyncio]>=2.0.49,<3.0.0",
    "sqlmodel>=0.0.22,<1.0.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1,<10.0.0",
    "mypy>=2.1.0,<3.0.0",
    "ruff>=0.15.18,<1.0.0",
    "coverage>=7.14.3,<8.0.0",
    "ty==0.0.74",
    "anyio>=4.12.0",
    "pytest-cov>=7.0.0",
    "prek>=0.4.8",
]

[build-system]
requires = ["uv_build>=0.11.31,<0.12.0"]
build-backend = "uv_build"

[tool.ty.analysis]
# Disable support for `type: ignore` comments
respect-type-ignore-comments = false

[tool.pytest]
addopts = ["--import-mode=importlib"]

[project.entry-points.pytest11]
mountory_core = "mountory_core.pytest_plugin"

[tool.mypy]
strict = true
enable_error_code = [
    "ignore-without-code"
]
warn_unused_ignores = true
exclude = [".venv"]
